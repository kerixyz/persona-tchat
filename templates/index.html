{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
        <div class="card shadow-lg animate__animated animate__fadeInUp">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0"><i class="bi bi-graph-up-arrow me-2"></i>Analyze Twitch VOD</h2>
            </div>
            <div class="card-body">
                <form id="downloadForm" method="post" action="/download_twitch" autocomplete="off" novalidate>
                    <div class="mb-3">
                        <label for="twitch_url" class="form-label">Twitch VOD URL</label>
                        <input type="url" class="form-control" id="twitch_url" name="twitch_urls"
                               placeholder="https://www.twitch.tv/videos/123456789" required
                               aria-describedby="vodHelp">
                        <div id="vodHelp" class="form-text">Paste a full Twitch VOD URL (e.g., https://www.twitch.tv/videos/123456789).</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <span class="bi bi-search me-2"></span>Analyze Chat
                    </button>
                </form>
            </div>
        </div>
        <div id="results" class="mt-4" style="display: none;">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0"><i class="bi bi-bar-chart-line me-2"></i>Results</h3>
                </div>
                <div class="card-body" id="resultsContent"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
